<p>1 Å主容差下，10条有开放方向的闭合起始轨迹中，9条在这些点内至少一半同时偏离两套NOE参照，另1条部分一致。开放起始组18/20一致，对照通过。</p>
<p>ES15开态违例由9.07降至1.12 Å，是真实改善；但固定容差限制了“接近开放”的表述。0.5/2 Å敏感性保留。旧差值读取第三列的前提已在分类前修正；原失败保留。</p>

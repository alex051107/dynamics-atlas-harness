# All four layers: layer 0 + layer 1 in the system prompt, methods and cases as consult tools, review node on.
name: W1
model: deepseek-flash
base_url: https://api.deepseek.com
api_key_env: DEEPSEEK_API_KEY
arm: A
include_base_prompt: true
prompt_files:
  - ../content/layer0_thinking.md
  - ../content/layer1_obligations.md
methods_file: ../content/layer2_methods.md
cases_file: ../content/layer3_cases.md
review_prompt_file: ../content/layer4_reviewer.md
enable_consult_tools: true
enable_review: true
max_review_rounds: 2
max_tool_calls: 70

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and exposed-capsule scientific extra
        run: python3 -m pip install '.[exposed-capsule-v1]'
      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

   <g id="text_1">
    <text style="font-weight: 700; font-size: 18px; font-family: 'Arial'; text-anchor: start; fill: #1f4e79" x="28.8" y="36.705938" transform="rotate(-0 28.8 36.705938)">How a rule is chosen</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #1f4e79" x="34.56" y="76.051406" transform="rotate(-0 34.56 76.051406)">The question:</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="34.56" y="89.24625" transform="rotate(-0 34.56 89.24625)">which difference must be resolved? (a population, a state reached, a rate, a</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="34.56" y="102.44625" transform="rotate(-0 34.56 102.44625)">local fluctuation)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #1f4e79" x="34.56" y="139.411406" transform="rotate(-0 34.56 139.411406)">The data:</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="34.56" y="152.539219" transform="rotate(-0 34.56 152.539219)">which measurement and which processing, and do they still preserve that</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="34.56" y="165.803672" transform="rotate(-0 34.56 165.803672)">difference?</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #1f4e79" x="34.56" y="202.771406" transform="rotate(-0 34.56 202.771406)">The rule:</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="34.56" y="215.96625" transform="rotate(-0 34.56 215.96625)">a relation with four parts: difference, measurement and processing, conditions,</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="34.56" y="229.163672" transform="rotate(-0 34.56 229.163672)">claim limit</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="34.56" y="272.72625" transform="rotate(-0 34.56 272.72625)">A fixed analysis step carries the rule as a precondition and a claim limit; the AI</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="34.56" y="285.859219" transform="rotate(-0 34.56 285.859219)">calls the step and attaches every number to it</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="34.56" y="342.750703" transform="rotate(-0 34.56 342.750703)">A control on the data must pass before the result enters the trust table</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="473.76" y="272.723672" transform="rotate(-0 473.76 272.723672)">Not: rule text pasted into the AI's prompt</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="473.76" y="285.92625" transform="rotate(-0 473.76 285.92625)">(tested 10 September, no gain)</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="473.76" y="336.150703" transform="rotate(-0 473.76 336.150703)">Two steps withdrawn on 11 September</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #2d2d2d" x="473.76" y="349.28625" transform="rotate(-0 473.76 349.28625)">after failing their control</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'Arial'; text-anchor: start; fill: #6b6b6b" x="28.8" y="390.40875" transform="rotate(-0 28.8 390.40875)">Dynamics Atlas · 11 September 2026</text>
   </g>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamics-atlas-harness"
version = "0.2.0"
description = "Typed Profile-to-Rules-to-registered-operator harness for Dynamics Atlas"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.3",
  "pymbar==4.0.3",
  "scipy==1.17.1",
]

[project.scripts]
dynamics-atlas = "dynamics_atlas_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
